name: nuty-build
on:
  push:
    branches: ['nuty/**']
    tags: ['nuty-v*']
  pull_request:
    branches: ['nuty/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Nuty bundle
        run: tools/nuty/dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuty-smoosic
          path: |
            dist/*.tar.gz
            dist/nuty-smoosic/SHA256SUMS
            dist/nuty-smoosic/VERSION
            dist/build.log
          retention-days: 30
      - name: Release
        if: startsWith(github.ref, 'refs/tags/nuty-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --title "${GITHUB_REF_NAME}" --notes-file dist/nuty-smoosic/VERSION
